import:
  discretization:
    path: tests/testdata/discretization_large.mesh
    type: mesh
    options:
      # optional: only process elements whose field has one of the values,
      # e.g. the material (MAT) or VTU cell data such as block_id
      element_filter:
        field: MAT
        values: [1, 2, 3]
  image:
    path: tests/testdata/image_large.dcm
    type: dicom
    options:
      metadata:
        pixel_spacing: [0.5, 0.5, 1.0]
        row_direction: [0, -1, 0]
        column_direction: [1, 0, 0]
        slice_direction: [0, 0, 1]
        image_position: [0, 0, 0]
processing:
  smoothing:
    area: 5
    visualize: true
  interpolation:
    method: elementcenter
  transformation:
    user_script: tests/testdata/user_script.py
    user_function: process_image_data
    normalize_values: true
    visualize: true
export:
  folder_path: your/tmp/path
  file_name: output_name
  # json, txt or discretization
  type: json
  # only for json: key of the exported data
  output_parameter_name: STIFFNESS
